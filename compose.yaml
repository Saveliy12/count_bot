name: family-expenses

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-expenses}
      POSTGRES_USER: ${POSTGRES_USER:-expenses}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-expenses}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    restart: on-failure:3
    stop_grace_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${COMPOSE_DATABASE_URL:-postgres://expenses:expenses@postgres:5432/expenses?sslmode=disable}
      HTTP_ADDR: ":8083"
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-openai/gpt-oss-120b}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.groq.com/openai/v1}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-20s}
      TIMEZONE: ${TIMEZONE:-Europe/Moscow}
      SEED_DEMO_USER: ${SEED_DEMO_USER:-true}
    ports:
      - "127.0.0.1:${APP_HOST_PORT:-8083}:8083"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8083/readyz >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

volumes:
  postgres_data:
