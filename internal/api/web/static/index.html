<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Семейные расходы</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">Семейный бюджет</p>
        <h1>Расходы</h1>
        <p class="lede">Все траты семьи в одном месте.</p>
      </div>
      <button class="button" id="add-expense" type="button" disabled aria-haspopup="dialog">Добавить трату</button>
    </header>

    <section class="receipt" aria-live="polite">
      <span class="receipt__stamp" aria-hidden="true">семья</span>
      <div class="receipt__row">
        <div>
          <span class="receipt__label">Итого за период</span>
          <strong class="receipt__total" id="total">— ₽</strong>
        </div>
      </div>
      <div class="receipt__meta">
        <span id="count">Загрузка…</span>
        <span id="period-label"></span>
      </div>
    </section>

    <section class="panel filters" aria-label="Фильтры">
      <label class="field">
        <span>Участник</span>
        <select id="member-filter">
          <option value="">Вся семья</option>
        </select>
      </label>

      <label class="field">
        <span>Период</span>
        <select id="period-filter">
          <option value="month">Этот месяц</option>
          <option value="today">Сегодня</option>
          <option value="week">Последние 7 дней</option>
          <option value="all">Всё время</option>
          <option value="custom">Свой диапазон</option>
        </select>
      </label>

      <div class="field field--dates" id="custom-dates" hidden>
        <span>Свой диапазон</span>
        <div class="date-range">
          <label>С <input type="date" id="from-filter"></label>
          <label>По <input type="date" id="to-filter"></label>
        </div>
      </div>

      <label class="field">
        <span>Категория</span>
        <select id="category-filter">
          <option value="">Все категории</option>
        </select>
      </label>

      <button class="button button--ghost" type="button" id="reset-filters">Сбросить</button>
    </section>

    <section class="panel list-panel" id="list-panel">
      <div class="list-head">
        <h2>Траты</h2>
        <span class="muted" id="list-hint"></span>
      </div>

      <p class="status" id="status" role="status" aria-live="polite"></p>

      <div class="table-wrap" id="table-wrap" hidden>
        <table>
          <caption class="visually-hidden">Траты семьи</caption>
          <thead>
            <tr>
              <th>Дата</th>
              <th>Кто</th>
              <th>Категория</th>
              <th>Комментарий</th>
              <th class="amount">Сумма</th>
              <th class="actions">Действия</th>
            </tr>
          </thead>
          <tbody id="expenses-body"></tbody>
        </table>
      </div>

      <div class="empty" id="empty" hidden>
        <p id="empty-title">За этот период трат нет.</p>
        <span>Попробуйте изменить фильтры.</span>
      </div>

      <div class="list-foot">
        <button class="button button--ghost" type="button" id="load-more" hidden>Показать ещё</button>
        <button class="button button--ghost" type="button" id="retry" hidden>Повторить</button>
      </div>
    </section>
  </main>

  <dialog class="dialog" id="expense-dialog" aria-labelledby="expense-dialog-title">
    <form class="expense-form" id="expense-form" novalidate>
      <div class="dialog-head">
        <p class="eyebrow" id="expense-dialog-eyebrow">Новая запись</p>
        <h2 id="expense-dialog-title">Добавить трату</h2>
      </div>

      <div class="form-grid">
        <label class="field">
          <span>Участник</span>
          <select id="form-user" required></select>
        </label>

        <label class="field">
          <span>Сумма</span>
          <input id="form-amount" type="text" inputmode="decimal" autocomplete="off" placeholder="350,50" required>
        </label>

        <label class="field">
          <span>Категория</span>
          <select id="form-category" required></select>
        </label>

        <label class="field">
          <span>Дата</span>
          <input id="form-date" type="date" required>
        </label>

        <label class="field form-comment">
          <span>Комментарий</span>
          <input id="form-comment" type="text" maxlength="500" placeholder="кофе">
        </label>
      </div>

      <p class="form-error" id="form-error" role="alert" hidden></p>

      <div class="dialog-actions">
        <button class="button button--ghost" type="button" id="form-cancel">Отмена</button>
        <button class="button" type="submit" id="form-submit">Сохранить</button>
      </div>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="/static/app.js" defer></script>
</body>
</html>
